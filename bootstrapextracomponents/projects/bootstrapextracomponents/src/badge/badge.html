<div class="bts-extra-badge" #element>
  @if (displayType() === 'LABEL') {
    <a
      class="{{styleClass()}} {{toneClass()}}"
      [svyTooltip]="toolTipText()"
      [class.disabled] = '!enabled()'
      [id]="servoyApi().getMarkupId()">
      <span class="badge-icon" aria-hidden="true">
        <i [class]="imageStyleClass()" aria-hidden="true"></i>
      </span>
      <span class="badge-text" [innerHTML]="$any(text()) | htmlFilter | trustAsHtml:isTrustedHTML()">
      </span>
      @if (showBadgeText()) {
        <span class="badge rounded-pill label-badge-class">{{badgeText()}}</span>
      }
    </a>
  }
  @if (!displayType() || displayType() === 'BUTTON') {
    <button
      type='button'
      [svyTooltip]="toolTipText()"
      class = "btn {{styleClass() ? styleClass() : 'btn-default'}} {{toneClass()}}"
      [disabled] = '!enabled()'
      [id]="servoyApi().getMarkupId()">
      <span class="badge-icon" aria-hidden="true">
        <i  [class]="imageStyleClass()" aria-hidden="true"></i>
      </span>
      <span class="badge-text" [innerHTML]="$any(text()) | htmlFilter | trustAsHtml:isTrustedHTML()">
      </span>
      @if (showBadgeText()) {
        <span class="badge rounded-pill label-badge-class">{{badgeText()}}</span>
      }
    </button>
  }
</div>
