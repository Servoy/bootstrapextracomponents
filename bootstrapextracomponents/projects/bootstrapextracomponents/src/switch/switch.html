<div class="bts-extra-switch" [class]="styleClass()" [sabloTabseq]="tabSeq()" [sabloTabseqConfig]="{container: false, tabSeqSetter: this}" [id]="servoyApi().getMarkupId()" #element>
    <bSwitch
        [disabled]="$any(!enabled() || readOnly())"
        [switch-disabled]="$any(!enabled() || readOnly())"
        [switch-size]="$any(componentSize())"
        [switch-animate]="$any(animate())"
        [switch-label-text]="$any(label())"
        [switch-on-text]="$any(onText())"
        [switch-off-text]="$any(offText())"
        [switch-on-color]="$any(onColor())"
        [switch-off-color]="$any(offColor())"
        [switch-label-width]="$any(labelWidth())"
        [switch-handle-width]="$any(handleWidth())"
        [ngModel]="_state()"
        (changeState)="onChange($any($event))">
    </bSwitch>
</div>
